<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile — CEMS</title>
  <meta name="description" content="View and manage your academic profile, enrolled clubs, and campus participation record." />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="cems-header scrolled">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="CEMS Homepage">
        <span>CEMS</span>
        <span class="brand-dot"></span>
      </a>

      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="clubs.html" class="nav-link">Clubs</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="student-dashboard.html" class="nav-link">Campus Hub</a>
        <a href="profile.html" class="nav-link active">Profile</a>
      </nav>

      <div class="nav-actions">
        <!-- Injected via main.js -->
        <a href="student-dashboard.html" class="btn btn-lime">
          <span>Campus Hub &rarr;</span>
        </a>
      </div>

      <button class="mobile-nav-toggle" aria-label="Open Mobile Menu">
        <span class="material-symbols-outlined" style="font-size: 26px;">menu</span>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Overlay -->
  <div class="mobile-nav-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
    <div>
      <div class="mobile-nav-header">
        <div class="brand-logo">
          <span>CEMS</span>
          <span class="brand-dot"></span>
        </div>
        <button class="mobile-nav-close" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size: 24px;">close</span>
        </button>
      </div>
      <ul class="mobile-nav-links" id="mobile-drawer-links">
        <li><a href="index.html" class="mobile-nav-link">Home</a></li>
        <li><a href="clubs.html" class="mobile-nav-link">Clubs</a></li>
        <li><a href="events.html" class="mobile-nav-link">Events</a></li>
        <li><a href="student-dashboard.html" class="mobile-nav-link">Campus Hub</a></li>
        <li><a href="profile.html" class="mobile-nav-link active">Profile</a></li>
      </ul>
    </div>
    <div>
      <a href="student-dashboard.html" class="btn btn-lime" style="width: 100%;">Campus Hub &rarr;</a>
    </div>
  </div>

  <main style="padding-top: calc(var(--header-height) + 2.5rem); min-height: 85vh; padding-bottom: 6rem;">
    <div class="section-wrapper" id="profile-container">
      <div style="text-align: center; padding: 6rem 0;">
        <span class="material-symbols-outlined" style="font-size: 36px; color: var(--lime-accent); animation: spin 1s infinite linear;">sync</span>
        <p style="color: var(--text-muted); margin-top: 1rem;">Querying student profile record...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="cems-footer">
    <div class="section-wrapper">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 CEMS &bull; College Event &amp; Registration Management System.</div>
        <div><a href="student-dashboard.html" style="color: var(--text-secondary);">&larr; Back to Campus Hub</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { api } from './js/api.js';
    import { escapeHtml, showToast, onReady } from './js/main.js';

    onReady(async () => {
      const container = document.getElementById('profile-container');
      if (!container) return;

      const status = await api.checkStatus();
      if (!status.authenticated || status.role !== 'student') {
        window.location.href = 'login.html?redirect=profile.html';
        return;
      }

      try {
        const [profileRes, myClubsRes, regRes] = await Promise.all([
          api.get('backend/students/get.php'),
          api.getMyClubs().catch(() => ({ data: [] })),
          api.get('backend/registrations/list.php?my=1').catch(() => ({ data: [] }))
        ]);

        const student = profileRes.data;
        const clubs = myClubsRes.data || [];
        const registrations = regRes.data || [];

        container.innerHTML = `
          <div style="max-width: 800px; margin: 0 auto;">
            
            <!-- Profile Identity Card -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 2.5rem; margin-bottom: 2.5rem;">
              <div style="display: flex; gap: 1.75rem; align-items: center; flex-wrap: wrap;">
                <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--bg-deep); border: 2px solid var(--lime-accent); display: flex; align-items: center; justify-content: center; color: var(--lime-accent); box-shadow: 0 0 20px var(--lime-glow);">
                  <span class="material-symbols-outlined" style="font-size: 42px;">person</span>
                </div>
                <div>
                  <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem;">
                    <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--text-primary);">
                      ${escapeHtml(student.name)}
                    </h1>
                    <span class="club-category-pill" style="color: var(--lime-accent); border-color: var(--lime-border);">Verified Student</span>
                  </div>
                  <div style="font-size: 0.88rem; color: var(--text-secondary);">
                    <span>${escapeHtml(student.department_name)}</span> &bull; 
                    <span>Semester ${student.semester}</span>
                  </div>
                </div>
              </div>

              <!-- Academic Details Grid -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-subtle);">
                <div>
                  <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Student ID</span>
                  <strong style="color: var(--text-primary); font-family: var(--font-display); font-size: 1.05rem;">#${student.student_id}</strong>
                </div>
                <div>
                  <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Institutional Email</span>
                  <strong style="color: var(--text-primary); font-size: 0.95rem;">${escapeHtml(student.email)}</strong>
                </div>
                <div>
                  <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Phone Number</span>
                  <strong style="color: var(--text-primary); font-size: 0.95rem;">${escapeHtml(student.phone)}</strong>
                </div>
                <div>
                  <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Enrollment Timestamp</span>
                  <span style="color: var(--text-secondary); font-size: 0.85rem;">${escapeHtml(student.created_at || 'Active')}</span>
                </div>
              </div>
            </div>

            <!-- Participation Summary -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 3rem;">
              <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1.75rem;">
                <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Joined Campus Clubs</span>
                <strong style="font-family: var(--font-display); font-size: 2rem; color: var(--lime-accent);">${clubs.length}</strong>
                <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem;">Active student community memberships</p>
              </div>

              <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1.75rem;">
                <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Event Passes Reserved</span>
                <strong style="font-family: var(--font-display); font-size: 2rem; color: var(--text-primary);">${registrations.length}</strong>
                <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem;">Campus event participations recorded</p>
              </div>
            </div>

            <!-- Actions Bar -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 2rem;">
              <a href="student-dashboard.html" class="btn btn-lime">
                <span>Go to Campus Hub &rarr;</span>
              </a>
              <button id="profile-logout-btn" class="btn btn-ghost" style="color: var(--status-closed);">
                <span class="material-symbols-outlined" style="font-size: 16px;">logout</span>
                <span>Sign Out</span>
              </button>
            </div>

          </div>
        `;

        document.getElementById('profile-logout-btn')?.addEventListener('click', async () => {
          try {
            await api.post('backend/auth/student_logout.php');
            showToast('Signed out successfully.', 'info');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 400);
          } catch (e) {
            window.location.reload();
          }
        });

      } catch (err) {
        console.error('Profile error:', err);
        container.innerHTML = `
          <div style="text-align: center; padding: 6rem 0;">
            <p style="color: var(--text-secondary);">Unable to load profile data.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
