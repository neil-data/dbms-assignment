<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Profile — CEMS</title>
  <meta name="description" content="View club mission, coordinators, meeting schedules, and upcoming hosted campus events." />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="cems-header scrolled">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="CEMS Homepage">
        <span>CEMS</span>
        <span class="brand-dot"></span>
      </a>

      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="clubs.html" class="nav-link active">Clubs</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="index.html#workflows" class="nav-link">Workflows</a>
        <a href="clubs.html" class="nav-link">Community</a>
        <a href="index.html#about" class="nav-link">About</a>
      </nav>

      <div class="nav-actions">
        <!-- Dynamically injected via main.js -->
        <a href="login.html" class="nav-signin-link">Sign In</a>
        <a href="register.html" class="btn btn-lime">
          <span>Join CEMS &rarr;</span>
        </a>
      </div>

      <button class="mobile-nav-toggle" aria-label="Open Mobile Menu">
        <span class="material-symbols-outlined" style="font-size: 26px;">menu</span>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Overlay -->
  <div class="mobile-nav-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
    <div>
      <div class="mobile-nav-header">
        <div class="brand-logo">
          <span>CEMS</span>
          <span class="brand-dot"></span>
        </div>
        <button class="mobile-nav-close" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size: 24px;">close</span>
        </button>
      </div>
      <ul class="mobile-nav-links" id="mobile-drawer-links">
        <li><a href="index.html" class="mobile-nav-link">Home</a></li>
        <li><a href="clubs.html" class="mobile-nav-link active">Clubs</a></li>
        <li><a href="events.html" class="mobile-nav-link">Events</a></li>
        <li><a href="index.html#workflows" class="mobile-nav-link">Workflows</a></li>
        <li><a href="index.html#about" class="mobile-nav-link">About</a></li>
      </ul>
    </div>
    <div>
      <a href="register.html" class="btn btn-lime" style="width: 100%; margin-bottom: 0.75rem;">Join CEMS &rarr;</a>
      <a href="login.html" class="btn btn-ghost" style="width: 100%;">Sign In</a>
    </div>
  </div>

  <main style="padding-top: calc(var(--header-height) + 2rem); min-height: 85vh; padding-bottom: 6rem;">
    <div class="section-wrapper" id="club-details-container">
      <div style="text-align: center; padding: 6rem 0;">
        <span class="material-symbols-outlined" style="font-size: 36px; color: var(--lime-accent); animation: spin 1s infinite linear;">sync</span>
        <p style="color: var(--text-muted); margin-top: 1rem;">Loading club profile...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="cems-footer">
    <div class="section-wrapper">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 CEMS &bull; College Event &amp; Registration Management System.</div>
        <div><a href="clubs.html" style="color: var(--text-secondary);">&larr; Back to Club Discovery</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { initClubDetails } from './js/clubs.js';
    import { onReady } from './js/main.js';
    onReady(initClubDetails);
  </script>
</body>
</html>
