<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrative Console — CEMS DBMS</title>
  <meta name="description" content="Central relational database management console for academic departments, venues, events, clubs, and student registrations." />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="cems-header scrolled">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="CEMS Homepage">
        <span>CEMS</span>
        <span class="brand-dot"></span>
      </a>

      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="clubs.html" class="nav-link">Clubs</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="admin.html" class="nav-link active">Admin Console</a>
        <a href="database-demo.html" class="nav-link" style="color: var(--lime-accent);">DBMS Demo</a>
      </nav>

      <div class="nav-actions">
        <a href="events.html" class="btn btn-ghost" style="font-size: 0.82rem;">Public Catalog</a>
      </div>

      <button class="mobile-nav-toggle" aria-label="Open Mobile Menu">
        <span class="material-symbols-outlined" style="font-size: 26px;">menu</span>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Overlay -->
  <div class="mobile-nav-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
    <div>
      <div class="mobile-nav-header">
        <div class="brand-logo">
          <span>CEMS</span>
          <span class="brand-dot"></span>
        </div>
        <button class="mobile-nav-close" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size: 24px;">close</span>
        </button>
      </div>
      <ul class="mobile-nav-links" id="mobile-drawer-links">
        <li><a href="index.html" class="mobile-nav-link">Home</a></li>
        <li><a href="clubs.html" class="mobile-nav-link">Clubs</a></li>
        <li><a href="events.html" class="mobile-nav-link">Events</a></li>
        <li><a href="admin.html" class="mobile-nav-link active">Admin Console</a></li>
        <li><a href="database-demo.html" class="mobile-nav-link">DBMS Demo</a></li>
      </ul>
    </div>
    <div>
      <a href="index.html" class="btn btn-ghost" style="width: 100%;">Back to Public Site</a>
    </div>
  </div>

  <main style="padding-top: calc(var(--header-height) + 2rem); min-height: 85vh; padding-bottom: 5rem;">
    <div class="section-wrapper" id="admin-console-content">
      <div style="text-align: center; padding: 6rem 0;">
        <span class="material-symbols-outlined" style="font-size: 36px; color: var(--lime-accent); animation: spin 1s infinite linear;">sync</span>
        <p style="color: var(--text-muted); margin-top: 1rem;">Connecting to CEMS DBMS management console...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="cems-footer">
    <div class="section-wrapper">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 CEMS &bull; Institutional Relational Management Layer (3NF).</div>
        <div><a href="database-demo.html" style="color: var(--lime-accent);">Interactive DBMS Console &rarr;</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { initAdminDashboard } from './js/dashboard.js';
    import { onReady } from './js/main.js';
    onReady(initAdminDashboard);
  </script>
</body>
</html>
